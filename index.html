<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexiDuel - Official Website</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #0A0C12;
      color: #E2E8F0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #121622;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 520px;
      width: 90%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 28px;
      margin: 16px 0 8px;
      color: #FFFFFF;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #6366F1;
      color: #FFFFFF;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.2s;
      margin: 6px;
    }
    .btn:hover { background: #4F46E5; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #CBD5E1;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.14); }
    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: #64748B;
    }
    .footer a {
      color: #94A3B8;
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 512 512" width="72" height="72">
      <rect width="512" height="512" rx="110" fill="#121622"/>
      <rect x="64" y="64" width="384" height="384" rx="80" fill="#6366F1"/>
      <path d="M160 360V160h60l80 120V160h52v200h-58l-82-124v124z" fill="#FFFFFF"/>
      <circle cx="390" cy="120" r="36" fill="#F59E0B"/>
    </svg>
    <h1>LexiDuel</h1>
    <p>Real-time word duels, crosswords, deductive co-op, and daily word challenges across 10 languages.</p>
    <a href="https://play.google.com/store/apps/details?id=com.kakagkai.lexiduel" class="btn">Get on Google Play</a>
    <a href="/privacy-policy.html" class="btn btn-secondary">Privacy Policy</a>
  </div>
  <div class="footer">
    &copy; 2026 LexiDuel Studio &middot; <a href="/app-ads.txt">app-ads.txt</a> &middot; <a href="/privacy-policy.html">Privacy</a>
  </div>
</body>
</html>
